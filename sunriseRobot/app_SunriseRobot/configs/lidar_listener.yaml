topic_name: /scan
queue_size: 3
response_dist: 2.0
sector_angle: 20
scan_expiration_time: 0.5
# min_response_dist applies only OUTSIDE front_arc (the robot's body blocks the lidar there).
# Inside front_arc the lidar is unobstructed, so any positive return is accepted.
min_response_dist: 0.2
# Arc (degrees, same convention as scan.angle_min) where the lidar has a clear view of the world.
# Wrap-around supported when low > high (e.g. [330, 30] = 60° centred on 0°). Set to null to
# disable the feature and apply min_response_dist uniformly.
front_arc: [-50, 50]
# Arc behind the lidar (same convention) where the robot's own parts are seen farther than min_response_dist:
# measured on 2026-11-21, the 160-180 deg sector had 8 returns between 0.2 and 0.3 m, enough to count as an
# obstacle and block driving backward. Inside rear_arc, returns closer than rear_min_response_dist are ignored.
# Set rear_arc to null to disable it.
rear_arc: [140, 220]
rear_min_response_dist: 0.35
verbose: 0